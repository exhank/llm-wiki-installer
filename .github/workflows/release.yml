name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build and check package
        run: make package-check

      - name: Smoke test wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail

          wheel=(dist/*.whl)
          python -m venv /tmp/llm-wiki-wheel
          /tmp/llm-wiki-wheel/bin/python -m pip install "${wheel[0]}"
          /tmp/llm-wiki-wheel/bin/llm-wiki-installer --help
          /tmp/llm-wiki-wheel/bin/llm-wiki-install --help

          sdist=(dist/*.tar.gz)
          python -m venv /tmp/llm-wiki-sdist
          /tmp/llm-wiki-sdist/bin/python -m pip install "${sdist[0]}"
          /tmp/llm-wiki-sdist/bin/llm-wiki-installer --help
          /tmp/llm-wiki-sdist/bin/llm-wiki-install --help

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import hashlib
          import json
          import pathlib
          import uuid

          init_path = pathlib.Path("src/llm_wiki_installer/__init__.py")
          module = ast.parse(init_path.read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              for target in node.targets
              if isinstance(target, ast.Name)
              and target.id == "__version__"
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )

          components = []
          for artifact in sorted(pathlib.Path("dist").glob("*")):
              if not artifact.is_file():
                  continue
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              components.append(
                  {
                      "type": "file",
                      "name": artifact.name,
                      "hashes": [{"alg": "SHA-256", "content": digest}],
                  }
              )

          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{uuid.uuid4()}",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "llm-wiki-installer",
                      "version": version,
                  }
              },
              "components": components,
          }
          pathlib.Path("dist/sbom.cdx.json").write_text(
              json.dumps(sbom, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Generate artifact checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: |
            dist/SHA256SUMS
            dist/sbom.cdx.json
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist

      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-metadata
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"

  pypi:
    name: Publish PyPI package
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
